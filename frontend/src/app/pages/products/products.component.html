<div class="min-h-screen py-10 max-w-7xl mx-auto px-4">
  <!-- Header with Search & Sort controls -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-ocean-500/40 mb-8">
    <div>
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue/10 border border-blue/30 text-blue text-xs font-bold uppercase tracking-wider mb-2">
        <i class="pi pi-box text-cyan"></i> Shop Collection
      </div>
      <h1 class="text-2xl md:text-3xl font-extrabold text-white">All Products</h1>
      <p class="text-xs text-ocean-300 mt-1">Explore our full catalog of high-grade merchandise.</p>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <app-search-bar
        [placeholder]="'Search products...'"
        [initialValue]="searchKey"
        (search)="onSearch($event)"
        class="w-full sm:w-64"
      ></app-search-bar>

      <app-sort-dropdown
        [options]="sortOptions"
        [selectedValue]="(sort$ | async) || ''"
        (selectionChange)="onSortChange($event)"
        class="w-full sm:w-48"
      ></app-sort-dropdown>
    </div>
  </div>

  <!-- Content States -->
  @if (loading) {
    <app-skeleton-loader [type]="'card'" [count]="8"></app-skeleton-loader>
  } @else if (error) {
    <div class="max-w-md mx-auto p-6 rounded-2xl bg-ocean-800 border border-red-500/30 text-center">
      <i class="pi pi-exclamation-triangle text-3xl text-red-400 mb-2"></i>
      <p class="text-xs text-ocean-200 mb-4">{{ error }}</p>
      <button (click)="retry()" class="px-4 py-2 text-xs font-semibold rounded-xl bg-blue text-white hover:bg-blue-hover">
        Retry
      </button>
    </div>
  } @else {
    <app-card
      [isSmallCard]="false"
      [searchKey]="searchKey"
      [Products]="allProducts"
    ></app-card>
  }
</div>
