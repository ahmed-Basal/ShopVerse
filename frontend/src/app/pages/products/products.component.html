<section class="py-5">
  <div class="container-fluid">
    <!-- Header with Search & Sort controls -->
    <div class="flex justify-content-between align-items-center flex-wrap gap-3 mb-5">
      <h2 class="text-color-secondary uppercase m-0 font-bold text-2xl">all Products</h2>
      
      <div class="flex flex-wrap align-items-center gap-3 w-full md:w-auto">
        <app-search-bar
          [placeholder]="'Search products by title or description...'"
          [initialValue]="searchKey"
          (search)="onSearch($event)"
          class="flex-1 md:flex-initial md:w-22rem"
        ></app-search-bar>

        <app-sort-dropdown
          [options]="sortOptions"
          [selectedValue]="(sort$ | async) || ''"
          (selectionChange)="onSortChange($event)"
          class="w-full md:w-auto"
        ></app-sort-dropdown>
      </div>
    </div>

    <!-- Main Content Area -->
    @if (loading) {
      <app-skeleton-loader [type]="'card'" [count]="8"></app-skeleton-loader>
    } @else if (error) {
      <div class="error-container text-center py-6 border-1 border-round-2xl border-200">
        <i class="pi pi-exclamation-circle text-4xl text-red-500 mb-2"></i>
        <p class="text-red-500 font-semibold mb-3">{{ error }}</p>
        <button class="btn-primary" (click)="retry()">Retry</button>
      </div>
    } @else if (allProducts.length === 0) {
      <div class="empty-container text-center py-8 border-1 border-round-2xl border-200">
        <i class="pi pi-search text-5xl text-300 mb-3"></i>
        <h3 class="text-xl font-bold mb-2 text-800">No results found</h3>
        <p class="text-color-secondary mb-4">We couldn't find any products matching "{{ searchKey }}"</p>
        <button class="btn-secondary px-4 py-2" (click)="onSearch('')">Clear Search</button>
      </div>
    } @else {
      <app-card
        [isSmallCard]="false"
        [searchKey]="searchKey"
        [Products]="allProducts"
      ></app-card>
    }
  </div>
</section>
