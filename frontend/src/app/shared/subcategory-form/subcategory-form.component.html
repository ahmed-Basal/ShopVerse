<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ocean-950/80 backdrop-blur-md">
  <div class="w-full max-w-lg bg-ocean-900 border border-ocean-700/80 rounded-2xl shadow-2xl overflow-hidden animate-fadeIn">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-ocean-800 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-cyan/15 text-cyan flex items-center justify-center">
          <i class="pi pi-folder-open text-xs"></i>
        </div>
        <h2 class="text-base font-bold text-white tracking-tight">
          {{ subcategory ? 'Edit Subcategory' : 'Add New Subcategory' }}
        </h2>
      </div>
      <button
        type="button"
        (click)="cancel()"
        class="p-1.5 rounded-lg text-ocean-400 hover:text-white hover:bg-ocean-800 transition-colors cursor-pointer"
      >
        <i class="pi pi-times text-sm"></i>
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="p-6 space-y-4">
      <div>
        <label for="subName" class="block text-xs font-semibold text-ocean-200 mb-1.5">
          Subcategory Name <span class="text-red-400">*</span>
        </label>
        <input
          id="subName"
          type="text"
          formControlName="name"
          placeholder="e.g. Wireless Earbuds"
          class="w-full px-3.5 py-2.5 rounded-xl bg-ocean-800 border border-ocean-700 text-white placeholder-ocean-400 text-xs focus:outline-none focus:border-cyan focus:ring-1 focus:ring-cyan transition-all"
        />
        @if (form.get('name')?.touched && form.get('name')?.invalid) {
          <span class="text-[11px] text-red-400 mt-1 block">Subcategory name is required (2-32 chars).</span>
        }
      </div>

      <div>
        <label for="subCategory" class="block text-xs font-semibold text-ocean-200 mb-1.5">
          Parent Category <span class="text-red-400">*</span>
        </label>
        <select
          id="subCategory"
          formControlName="category"
          class="w-full px-3.5 py-2.5 rounded-xl bg-ocean-800 border border-ocean-700 text-white text-xs focus:outline-none focus:border-cyan focus:ring-1 focus:ring-cyan transition-all cursor-pointer"
        >
          <option value="" disabled selected class="bg-ocean-900 text-ocean-400">Select parent category</option>
          @for (cat of categories; track (cat.id || cat._id)) {
            <option [value]="cat.id || cat._id" class="bg-ocean-900 text-white">{{ cat.name }}</option>
          }
        </select>
        @if (form.get('category')?.touched && form.get('category')?.invalid) {
          <span class="text-[11px] text-red-400 mt-1 block">Parent category is required.</span>
        }
      </div>

      <div>
        <label for="subDescription" class="block text-xs font-semibold text-ocean-200 mb-1.5">
          Description (Optional)
        </label>
        <textarea
          id="subDescription"
          formControlName="description"
          rows="2"
          placeholder="Short description for this subcategory..."
          class="w-full px-3.5 py-2.5 rounded-xl bg-ocean-800 border border-ocean-700 text-white placeholder-ocean-400 text-xs focus:outline-none focus:border-cyan focus:ring-1 focus:ring-cyan transition-all resize-y"
        ></textarea>
      </div>

      <!-- Dual-Mode Image Uploader -->
      <app-image-uploader
        [label]="'Subcategory Image / Icon (Optional)'"
        [initialUrl]="imageUrl"
        [placeholder]="'https://images.unsplash.com/photo-1542291026-7eec264c27ff'"
        [hint]="'Upload a thumbnail icon or paste an image URL link.'"
        (imageChange)="onImageChange($event)"
      ></app-image-uploader>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 pt-3 border-t border-ocean-800">
        <button
          type="button"
          (click)="cancel()"
          class="px-4 py-2 rounded-xl bg-ocean-800 hover:bg-ocean-700 text-ocean-300 hover:text-white text-xs font-semibold border border-ocean-700 transition-all cursor-pointer"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="loading"
          class="px-5 py-2 rounded-xl bg-gradient-to-r from-blue to-cyan hover:opacity-95 text-white text-xs font-bold shadow-blue transition-all flex items-center gap-2 cursor-pointer disabled:opacity-50"
        >
          @if (loading) {
            <i class="pi pi-spin pi-spinner text-xs"></i>
            <span>Saving...</span>
          } @else {
            <span>{{ subcategory ? 'Save Changes' : 'Create Subcategory' }}</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
