<div class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h2>{{ subcategory ? 'Edit Subcategory' : 'Add New Subcategory' }}</h2>
      <button type="button" class="close-btn" (click)="cancel()">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="modal-form">
      <div class="form-group">
        <label for="name">Subcategory Name</label>
        <input id="name" type="text" formControlName="name" placeholder="Enter subcategory name" />
        @if (form.get('name')?.touched && form.get('name')?.invalid) {
          <span class="error-text">Subcategory name is required (2-32 chars).</span>
        }
      </div>

      <div class="form-group">
        <label for="category">Parent Category</label>
        <select id="category" formControlName="category">
          <option value="" disabled selected>Select parent category</option>
          @for (cat of categories; track cat._id) {
            <option [value]="cat._id">{{ cat.name }}</option>
          }
        </select>
        @if (form.get('category')?.touched && form.get('category')?.invalid) {
          <span class="error-text">Parent category is required.</span>
        }
      </div>

      <div class="form-group">
        <label for="description">Description (Optional)</label>
        <textarea id="description" formControlName="description" placeholder="Enter optional description" rows="3"></textarea>
      </div>

      <!-- Dual-Mode Image Uploader -->
      <app-image-uploader
        [label]="'Subcategory Image/Icon (Optional)'"
        [initialUrl]="imageUrl"
        [placeholder]="'https://images.unsplash.com/photo-1542291026-7eec264c27ff'"
        [hint]="'Upload a thumbnail icon or paste an image URL link.'"
        (imageChange)="onImageChange($event)"
      ></app-image-uploader>

      <div class="form-actions">
        <button type="button" class="btn-secondary px-4 py-2" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn-primary px-4 py-2" [disabled]="loading">
          @if (loading) {
            <i class="pi pi-spin pi-spinner"></i> Saving...
          } @else {
            {{ subcategory ? 'Save Changes' : 'Create' }}
          }
        </button>
      </div>
    </form>
  </div>
</div>
