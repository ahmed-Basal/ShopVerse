<div class="flex justify-content-between align-items-center flex-wrap">
  @for (product of Products; track $index) {
  <div
    [ngClass]="{
      'col-6': isSmallCard,
      'col-12 md:col-4 lg:col-3': !isSmallCard
    }"
  >
    <div
      [ngClass]="{
        'flex flex-wrap lg:flex-nowrap justify-content-center gap-2':
          isSmallCard,
      }"
    >
      <figure
        [routerLink]="['/details', product.id]"
        [ngClass]="{ 'md:w-6rem lg:w-9rem': isSmallCard,  }"
        class="m-1 shadow-2 border-round-2xl overflow-hidden cursor-pointer relative"
      >
        <img
          #image
          [ngClass]="{ 'h-full': isSmallCard, 'h-20rem': !isSmallCard }"
          class="w-full"
          [src]="product.image"
          (error)="
            image.src =
              'https://storage.googleapis.com/fir-auth-1c3bc.appspot.com/1692257709689-logitech heaphone.jpg'
          "
          alt="product"
        />

        <!-- Floating Favorite Heart Toggle -->
        <button type="button" 
                class="absolute top-0 right-0 m-2 w-2.5rem h-2.5rem border-circle border-none shadow-2 bg-white flex align-items-center justify-content-center cursor-pointer hover:scale-110 z-2"
                style="transition: all 0.2s;"
                (click)="toggleWishlist(product, $event)">
          <i class="pi text-lg" 
             [class.pi-heart-fill]="wishlistProductIds.has(product.id) || wishlistProductIds.has(product._id || '')" 
             [class.pi-heart]="!wishlistProductIds.has(product.id) && !wishlistProductIds.has(product._id || '')"
             [class.text-red-500]="wishlistProductIds.has(product.id) || wishlistProductIds.has(product._id || '')"
             [class.text-500]="!wishlistProductIds.has(product.id) && !wishlistProductIds.has(product._id || '')"></i>
        </button>
      </figure>
      <div class="content py-1 w-full">
        <p class="truncate-text overflow-hidden font-medium text-xs my-1">
          {{ product.description }}
        </p>
        <div class="flex align-items-center gap-2">
          <div class="price flex gap-2 align-items-center">
            <span class="text-color-secondary font-bold">
              <del>14</del>
            </span>
            <span class="new-price font-bold">
              <span class="text-green-400">$</span> {{ product.price }}
            </span>
          </div>
          <div class="offer">
            <span class="bg-red-500 p-1 border-circle text-white text-xs"
              >%{{ product.discount }}</span
            >
            <span class="fonot-bold text-xs font-bold px-1">off</span>
          </div>
        </div>
      </div>
      @if (!isSmallCard) { @if (!product.isAddedToCart) {
      <p-button
        (click)="addToCart(product); product.isAddedToCart = true"
        label="add to cart"
        severity="warning"
        styleClass="my-2 uppercase w-full"
        icon="pi pi-cart-plus text-2xl"
        iconPos="right"
      />

      } @if (product.isAddedToCart) {
      <p-button
        [routerLink]="['/cart']"
        label="go to cart"
        severity="contrast"
        styleClass="my-2 uppercase w-full"
        icon="pi pi-shopping-cart text-2xl"
        iconPos="right"
      />
      } }
    </div>
  </div>
  }@empty { @if (!isSmallCard) {
  <div class="flex-1 text-center">
    <app-empty></app-empty>
    <h2 class="capitalize">
      no product to show <span class="text-red-500">{{ searchKey }}</span>
    </h2>
    <p-button
      [routerLink]="['/home']"
      label="back To home"
      severity="warning"
      styleClass="my-2 uppercase w-full"
    />
  </div>
  } }
</div>
